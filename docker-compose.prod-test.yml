# Disposable Compose Project for Production-Topology Verification
services:
  postgres:
    image: postgres:17-alpine
    container_name: talentlens-e2e-postgres
    restart: 'no'
    environment:
      POSTGRES_DB: talentlens_scorecard_test
      POSTGRES_USER: talentlens
      POSTGRES_PASSWORD: talentlens_local_only
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U talentlens -d talentlens_scorecard_test']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e-net

  s3mock:
    image: adobe/s3mock:latest
    container_name: talentlens-e2e-s3mock
    restart: 'no'
    environment:
      initialBuckets: talentlens-test-resumes
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - e2e-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: talentlens-e2e-mailpit
    restart: 'no'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    networks:
      - e2e-net

  clamav:
    image: clamav/clamav:1.4
    container_name: talentlens-e2e-clamav
    restart: 'no'
    expose:
      - '3310'
    ports:
      - '127.0.0.1:3310:3310'
    networks:
      - e2e-net

  migration:
    image: talentlens-api:latest
    container_name: talentlens-e2e-migration
    restart: 'no'
    command: ['node', './node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://talentlens:talentlens_local_only@postgres:5432/talentlens_scorecard_test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - e2e-net

  api:
    image: talentlens-api:latest
    container_name: talentlens-e2e-api
    restart: 'no'
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: test
      PORT: 3000
      API_PORT: 3000
      DATABASE_URL: postgresql://talentlens:talentlens_local_only@postgres:5432/talentlens_scorecard_test
      APP_ORIGIN: http://localhost:8080
      EMAIL_OUTBOX_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EMAIL_OUTBOX_IDEMPOTENCY_SECRET: talentlens-idempotency-test-secret-at-least-32-chars-long
      STORAGE_DRIVER: s3
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: 'false'
      S3_BUCKET: talentlens-test-resumes
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY_ID: test-key
      S3_SECRET_ACCESS_KEY: test-secret
      S3_FORCE_PATH_STYLE: 'true'
      SCANNER_DRIVER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCANNER_FAIL_CLOSED: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_REQUIRE_TLS: 'false'
      EMAIL_FROM: no-reply@talentlens.ai
      GEMINI_API_KEY: mock-test-key
      GEMINI_MODEL: gemini-3.8-flash
      ASSESSMENT_PROVIDER: fake
      CONSENT_APPROVED_POLICY_VERSIONS: 2026-11-v1
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/ready').then(async r => { if (!r.ok) process.exit(1); const j = await r.json(); process.exit(j.status === 'ready' && j.database === 'connected' ? 0 : 1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - e2e-net

  worker:
    image: talentlens-worker:latest
    container_name: talentlens-e2e-worker
    restart: 'no'
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://talentlens:talentlens_local_only@postgres:5432/talentlens_scorecard_test
      EMAIL_OUTBOX_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      EMAIL_OUTBOX_IDEMPOTENCY_SECRET: talentlens-idempotency-test-secret-at-least-32-chars-long
      STORAGE_DRIVER: s3
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: 'false'
      S3_BUCKET: talentlens-test-resumes
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3mock:9090
      S3_ACCESS_KEY_ID: test-key
      S3_SECRET_ACCESS_KEY: test-secret
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_REQUIRE_TLS: 'false'
      EMAIL_FROM: no-reply@talentlens.ai
      GEMINI_API_KEY: mock-test-key
      GEMINI_MODEL: gemini-3.8-flash
      ASSESSMENT_PROVIDER: fake
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', 'apps/worker/dist/healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - e2e-net

  web:
    image: talentlens-web:latest
    container_name: talentlens-e2e-web
    restart: 'no'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - e2e-net

networks:
  e2e-net:
    driver: bridge
