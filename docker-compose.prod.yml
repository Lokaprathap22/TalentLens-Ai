services:
  postgres:
    image: postgres:17-alpine
    container_name: talentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentlens}
      POSTGRES_USER: ${POSTGRES_USER:-talentlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-talentlens} -d ${POSTGRES_DB:-talentlens}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  clamav:
    image: clamav/clamav:latest
    container_name: talentlens-clamav
    restart: unless-stopped
    expose:
      - '3310'
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 3310 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # One-shot database migration container executed before API/Worker launch
  migration:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: talentlens-migration
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: talentlens-api
    restart: unless-stopped
    # CRITICAL: API is constrained to single instance due to process-local rate limiters
    deploy:
      replicas: 1
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN required}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:?EMAIL_OUTBOX_ENCRYPTION_KEY required}
      EMAIL_OUTBOX_IDEMPOTENCY_SECRET: ${EMAIL_OUTBOX_IDEMPOTENCY_SECRET:?EMAIL_OUTBOX_IDEMPOTENCY_SECRET required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_BUCKET: ${S3_BUCKET:-talentlens-resumes}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY required}
      SCANNER_DRIVER: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SCANNER_FAIL_CLOSED: 'true'
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@talentlens.ai}
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: talentlens-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      EMAIL_OUTBOX_ENCRYPTION_KEY: ${EMAIL_OUTBOX_ENCRYPTION_KEY:?EMAIL_OUTBOX_ENCRYPTION_KEY required}
      EMAIL_OUTBOX_IDEMPOTENCY_SECRET: ${EMAIL_OUTBOX_IDEMPOTENCY_SECRET:?EMAIL_OUTBOX_IDEMPOTENCY_SECRET required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_BUCKET: ${S3_BUCKET:-talentlens-resumes}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@talentlens.ai}
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: talentlens-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
